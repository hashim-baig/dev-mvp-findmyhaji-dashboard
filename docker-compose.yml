services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: findmyhaji-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: findmyhaji123
      POSTGRES_DB: findmyhaji
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - findmyhaji-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d findmyhaji"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Node.js Backend API (commented out)
  backend:
   build:
    context: ./backend
    dockerfile: Dockerfile
   container_name: findmyhaji-backend
   restart: unless-stopped
   environment:
    NODE_ENV: production
    PORT: 8001
    POSTGRES_HOST: postgres
    POSTGRES_USER: admin
    POSTGRES_PASSWORD: findmyhaji123
    POSTGRES_DB: findmyhaji
    POSTGRES_PORT: 5432
    DATABASE_URL: postgres://admin:findmyhaji123@postgres:5432/findmyhaji
    JWT_SECRET: findmyhaji_jwt_secret_key_2025
    FRONTEND_URL: http://localhost:3000
   ports:
    - "8001:8001"
   depends_on:
    postgres:
      condition: service_healthy
   volumes:
     - ./backend:/app/backend
     - /app/backend/node_modules
   networks:
     - findmyhaji-network
   healthcheck:
     test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
     interval: 30s
     timeout: 10s
     retries: 3

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: findmyhaji-frontend
    restart: unless-stopped
    environment:
      REACT_APP_BACKEND_URL: http://localhost:8001
      PORT: 3000
      BROWSER: none
    ports:
      - "3000:3000"
    # depends_on:
    #   backend:
    #     condition: service_healthy
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    networks:
      - findmyhaji-network
    stdin_open: true
    tty: true

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: findmyhaji-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      # - backend
    networks:
      - findmyhaji-network
    profiles:
      - production

volumes:
  postgres_data:
    driver: local

networks:
  findmyhaji-network:
    driver: bridge
